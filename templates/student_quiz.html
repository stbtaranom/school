<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ quiz.title }} | شاهد فاطمیه</title><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#193332;--teal:#1e6864;--mint:#e7f0ea;--paper:#fffdfa;--line:#dce5df;--coral:#e8a184}*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif}.container{width:min(900px,calc(100% - 28px));margin:auto}header{background:var(--ink);color:#fff}.topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--coral);color:var(--ink);border-radius:12px 4px;font:700 20px Estedad}.brand strong,.brand small{display:block}.brand strong{font:700 15px Estedad}.brand small{color:#a6bdb6;font-size:9px;margin-top:2px}.main{padding:32px 0 70px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px}.title{font:700 29px Estedad;margin:0}.course{color:var(--teal);font-size:11px;margin:8px 0 18px}.description{color:#657774;font-size:12px;line-height:2}.questions{display:grid;gap:18px;margin:24px 0}.question{padding:18px;border:1px solid var(--line);border-radius:8px}.question h2{font:600 15px Vazirmatn;margin:0 0 14px}.options{display:grid;gap:8px}.option{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f4f7f4;border-radius:6px}.option input{accent-color:var(--teal)}.submit{padding:13px 20px;border:0;background:var(--teal);color:#fff;border-radius:6px;cursor:pointer;font:600 12px Vazirmatn}.back{display:inline-block;margin-top:18px;color:var(--teal);font-size:11px;font-weight:700}.question h2::before{content:'سوال ';color:var(--teal);font-weight:700}@media(max-width:600px){.card{padding:20px}.question{padding:14px}}</style></head>
<body><header><div class="container topbar"><div class="brand"><span class="mark">ش</span><span><strong>شاهد فاطمیه</strong><small>آزمون آنلاین</small></span></div><a href="{{ url_for('student_dashboard') }}" style="color:#fff;font-size:11px">داشبورد</a></div></header><main class="main"><div class="container"><div class="card"><h1 class="title">{{ quiz.title }}</h1><p class="course">درس: {{ quiz.course_name }}</p><p class="description">{{ quiz.description }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="questions">{% for item in questions %}<div class="question"><h2>{{ loop.index }}: {{ item.question }}</h2><div class="options">{% for option in item.options %}<label class="option"><input type="radio" name="answer_{{ item.id }}" value="{{ option }}" required><span>{{ option }}</span></label>{% endfor %}</div></div>{% endfor %}</div><button class="submit" type="submit">ثبت پاسخ و مشاهده نتیجه</button></form></div><a class="back" href="{{ url_for('student_dashboard') }}">← بازگشت به داشبورد</a></div></main></body></html>
