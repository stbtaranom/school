<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>نتیجه آزمون | شاهد فاطمیه</title><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#193332;--teal:#1e6864;--mint:#e7f0ea;--paper:#fffdfa;--line:#dce5df;--gold:#d5a06d}*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif}.container{width:min(900px,calc(100% - 28px));margin:auto}header{background:var(--ink);color:#fff}.topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;display:grid;place-items:center;background:#e8a184;color:var(--ink);border-radius:12px 4px;font:700 20px Estedad}.brand strong,.brand small{display:block}.brand strong{font:700 15px Estedad}.brand small{color:#a6bdb6;font-size:9px;margin-top:2px}.main{padding:32px 0 70px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px}.score{font:700 45px Estedad;color:var(--teal);margin:10px 0}.summary{color:#657774;font-size:13px;line-height:2}.result{background:var(--mint);padding:18px;border-radius:10px;margin:18px 0}.answers{display:grid;gap:12px;margin-top:20px}.answer{padding:14px;background:#f4f7f4;border-radius:8px}.answer strong{font-size:12px}.answer span{float:left;color:var(--teal);font-weight:700}.button{display:inline-block;margin-top:18px;background:var(--teal);color:#fff;padding:12px 18px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none}@media(max-width:600px){.card{padding:20px}.score{font-size:36px}}</style></head>
<body><header><div class="container topbar"><div class="brand"><span class="mark">ش</span><span><strong>شاهد فاطمیه</strong><small>نتیجه آزمون</small></span></div><a href="{{ url_for('student_dashboard') }}" style="color:#fff;font-size:11px">داشبورد</a></div></header><main class="main"><div class="container"><div class="card"><h1>نتیجه آزمون</h1><p class="course">{{ quiz.title }}</p><div class="result"><div class="score">{{ score }} از {{ total_score }}</div><p class="summary">امتیاز شما با پاسخ‌های ثبت‌شده محاسبه شد.</p></div><div class="answers">{% for key, value in answers.items() %}<div class="answer"><strong>پاسخ سوال {{ loop.index }}</strong><span>{{ value }}</span></div>{% endfor %}</div><a class="button" href="{{ url_for('student_dashboard') }}">بازگشت به داشبورد</a></div></div></main></body></html>
