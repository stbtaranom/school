<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود معلم | شاهد فاطمیه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#193332;--teal:#1e6864;--coral:#e8a184;--paper:#fffdfa;--line:#dce5df;--muted:#657774}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f3ed;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;display:grid;place-items:center;padding:22px}.login{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);padding:34px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;display:grid;place-items:center;background:var(--coral);border-radius:12px 4px;font:700 22px Estedad}.brand strong,.brand small{display:block}.brand strong{font:700 15px Estedad}.brand small{font-size:10px;color:var(--muted);margin-top:3px}.eyebrow{margin:30px 0 6px;color:var(--teal);font-size:11px;font-weight:700}h1{font:700 28px Estedad;margin:0}.copy{font-size:12px;line-height:1.9;color:var(--muted);margin:8px 0 24px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:11px;font-weight:600}.field input{width:100%;height:46px;border:1px solid var(--line);background:#fff;padding:0 12px;font:inherit;font-size:13px}.submit{width:100%;height:46px;margin-top:10px;border:0;background:var(--teal);color:#fff;font:600 13px Vazirmatn;cursor:pointer}.error{padding:10px;background:#fbe9e4;color:#8e4230;font-size:12px}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><span class="mark">ش</span><span><strong>شاهد فاطمیه</strong><small>پنل دبیران</small></span></div>
    <p class="eyebrow">ورود همکاران آموزشی</p><h1>ورود معلم</h1><p class="copy">برای مدیریت نمرات، آزمون‌ها و گزارش کلاس وارد حساب خود شوید.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">رمز عبور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="submit" type="submit">ورود به پنل</button>
    </form>
  </main>
</body>
</html>
