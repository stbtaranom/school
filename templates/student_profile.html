<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>پروفایل دانش‌آموز | شاهد فاطمیه</title><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#193332;--teal:#1e6864;--mint:#e7f0ea;--paper:#fffdfa;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif}.container{width:min(760px,calc(100% - 32px));margin:auto}header{background:var(--ink);color:#fff}.topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;display:grid;place-items:center;background:#e8a184;color:var(--ink);border-radius:12px 4px;font:700 20px Estedad}.brand strong,.brand small{display:block}.brand strong{font:700 15px Estedad}.brand small{color:#a6bdb6;font-size:9px;margin-top:2px}.main{padding:38px 0 70px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:32px}.avatar{width:64px;height:64px;display:grid;place-items:center;background:var(--mint);color:var(--teal);border-radius:50%;font:700 26px Estedad}.card h1{font:700 29px Estedad;margin:14px 0 6px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:22px}.item{padding:14px 16px;background:#f5f7f4;border-radius:8px}.item span{display:block;color:#657774;font-size:10px}.item strong{display:block;font-size:13px;margin-top:4px}.back{display:inline-block;margin-top:18px;color:var(--teal);font-size:11px;font-weight:700}@media(max-width:500px){.detail{grid-template-columns:1fr}.card{padding:22px}}</style></head>
<body><header><div class="container topbar"><div class="brand"><span class="mark">ش</span><span><strong>شاهد فاطمیه</strong><small>پروفایل دانش‌آموز</small></span></div><a href="{{ url_for('student_dashboard') }}" style="color:#fff;font-size:11px">داشبورد</a></div></header><main class="main"><div class="container"><div class="card"><div class="avatar">{{ student.name[0] }}</div><h1>{{ student.name }}</h1><p>دانش‌آموز {{ student.class_name }}</p><div class="detail"><div class="item"><span>شماره دانش‌آموزی</span><strong>{{ student.student_number }}</strong></div><div class="item"><span>پایه و کلاس</span><strong>{{ student.class_name }}</strong></div></div></div><a class="back" href="{{ url_for('student_dashboard') }}">← بازگشت به داشبورد</a></div></main></body></html>
