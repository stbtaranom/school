<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود دانش‌آموز | شاهد فاطمیه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#193332;--teal:#1e6864;--mint:#e7f0ea;--coral:#e8a184;--paper:#fffdfa;--line:#dce5df;--error:#8f403a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#edf4ee,#f8f6f1 45%,#f0ddd1)}body,button,input{font-family:'Vazirmatn',Tahoma,sans-serif}.login-box{width:min(100%,430px);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:34px;box-shadow:0 16px 45px rgba(25,51,50,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:46px;height:46px;display:grid;place-items:center;background:var(--teal);color:#fff;border-radius:14px 4px;font:700 24px Estedad}.brand strong,.brand small{display:block}.brand strong{font:700 17px Estedad}.brand small{color:#657774;font-size:11px;margin-top:2px}h1{font:700 29px Estedad;margin:0 0 8px}.subtitle{color:#657774;font-size:13px;line-height:2;margin:0 0 22px}.field{margin-bottom:18px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}.field input{width:100%;padding:13px;border:1px solid #cad8d1;background:#fff;color:var(--ink);direction:ltr;font:14px Vazirmatn}.field input:focus{outline:2px solid #8bb8ad;border-color:var(--teal)}button{width:100%;padding:13px;border:0;background:var(--teal);color:#fff;font:600 13px Vazirmatn;cursor:pointer;border-radius:6px}.error{padding:11px 12px;margin:0 0 16px;background:#fae8e0;color:var(--error);font-size:12px;border-radius:5px}.note{margin-top:16px;text-align:center;color:#657774;font-size:11px}.note a{color:var(--teal);font-weight:700}
  </style>
</head>
<body>
  <main class="login-box">
    <div class="brand"><span class="mark">ش</span><span><strong>شاهد فاطمیه</strong><small>پورتال دانش‌آموزان</small></span></div>
    <h1>ورود به پنل دانش‌آموز</h1>
    <p class="subtitle">برای مشاهده نمرات، بررسی آزمون‌ها و اطلاعات شخصی وارد حساب خود شوید.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="student_number">شماره دانش‌آموزی</label><input id="student_number" name="student_number" type="text" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">رمز عبور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">ورود به حساب</button>
    </form>
    <p class="note">برای ورود آزمایشی، شماره 1001 و رمز  student123 را وارد کنید.</p>
  </main>
</body>
</html>
