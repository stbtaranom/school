<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ساخت حساب معلم | شاهد فاطمیه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#193332;--teal:#1e6864;--coral:#e8a184;--paper:#fffdfa;--line:#dce5df;--muted:#657774;--error:#8f403a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f3ed;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif}.box{width:min(470px,100%);background:var(--paper);border:1px solid var(--line);padding:32px}.brand{display:flex;align-items:center;gap:10px;font:700 15px Estedad;margin-bottom:24px}.mark{display:grid;place-items:center;width:40px;height:40px;background:var(--coral);border-radius:12px 4px}.eyebrow{color:var(--teal);font-size:10px;font-weight:700}h1{font:700 26px Estedad;margin:6px 0}.copy{color:var(--muted);font-size:12px;line-height:1.9;margin:0 0 20px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;font-weight:600}.field input{height:43px;border:1px solid var(--line);padding:0 11px;font:13px Vazirmatn;direction:ltr}.hint{font-size:10px;color:var(--muted);margin-top:-5px}.submit{height:44px;width:100%;margin-top:8px;background:var(--teal);color:white;border:0;font:600 12px Vazirmatn;cursor:pointer}.error{background:#fae8e0;color:var(--error);padding:10px;font-size:11px}.back{display:block;margin-top:15px;color:var(--teal);font-size:11px;text-align:center}
  </style>
</head>
<body>
  <main class="box">
    <div class="brand"><span class="mark">ش</span><span>شاهد فاطمیه | پنل دبیران</span></div>
    <span class="eyebrow">ثبت‌نام همکاران آموزشی</span>
    <h1>ساخت حساب معلم</h1>
    <p class="copy">برای جلوگیری از ثبت‌نام غیرمجاز، ساخت حساب معلم به کد دعوت مدرسه نیاز دارد.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="name">نام و نام خانوادگی</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="username">نام کاربری</label><input id="username" name="username" minlength="3" maxlength="40" pattern="[A-Za-z][A-Za-z0-9_.-]{2,39}" autocomplete="username" required><span class="hint">با حرف انگلیسی شروع شود؛ سپس حروف، عدد، نقطه، خط تیره یا زیرخط</span></div>
      <div class="field"><label for="password">رمز عبور</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="password_confirmation">تکرار رمز عبور</label><input id="password_confirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="invite_code">کد دعوت مدرسه</label><input id="invite_code" name="invite_code" type="password" autocomplete="off" required></div>
      <button class="submit" type="submit">ثبت حساب و ورود</button>
    </form>
    <a class="back" href="{{ url_for('teacher_login') }}">قبلاً حساب ساخته‌ام؛ ورود</a>
  </main>
</body>
</html>
